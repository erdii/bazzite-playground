# Upstream yields to plymouth; we take over the screen from it instead.
[Unit]
ConditionPathExists=

[Service]
ExecStartPre=/usr/libexec/unl0kr-wait-drm
# plymouth only quits once its splash goes idle, which never happens while it
# shows a password prompt (SIGTERM takes the same path). Kill it so it drops
# DRM master for unl0kr.
ExecStartPre=-/bin/sh -c "/usr/bin/plymouth quit & sleep 2; kill -KILL \"$$(cat /run/plymouth/pid)\""
