# Upstream yields to plymouth; we borrow the display from it instead.
[Unit]
ConditionPathExists=

[Service]
ExecStartPre=/usr/libexec/unl0kr-wait-drm
# Drop plymouth to the background so it releases DRM master but keeps its
# splash for afterwards. If that hangs, unl0kr must still get the display.
ExecStartPre=-/bin/sh -c "timeout 5 /usr/bin/plymouth deactivate || kill -KILL \"$$(cat /run/plymouth/pid)\""
ExecStopPost=-/usr/bin/plymouth reactivate
